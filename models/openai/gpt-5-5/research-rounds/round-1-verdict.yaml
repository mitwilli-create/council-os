# Recommendation to GPT-5.5 for Round 2
recommendation: |
  Round 2 required. Reset the approach: stop performing humility, start reading the grounding repo.

  Specific corrective directives for Round 2:
  1. Open and read _official-models-overview.md and _official-prompt-guidance.md before
     writing the first sentence. The doc cache exists for a reason.
  2. Run at least 5 WebSearch calls and 3 WebFetch calls to corroborate benchmark numbers,
     pricing, release date, and peer comparisons. None of these took the adjudicator
     more than 2 minutes per claim.
  3. Reduce [UNKNOWN] / [INFERRED] / [UNVERIFIED] markers from ~92 to ≤20.
  4. Open Section 5 with a peer beating GPT-5.5 (SWE-bench Pro: Opus 4.7 64.3% vs.
     GPT-5.5 58.6%) — same anti-egoism pattern as Opus 4.7 Round 2 used.
  5. Differentiate GPT-5.5 from GPT-5.4 (same-provider sibling), GPT-5.5 Pro
     (intra-sibling), GPT-5.3-Codex (specialized), and the mini/nano cost tiers.
     Include price-delta and crossover point for each.
  6. The clean-on-sycophancy-because-it-claims-nothing pattern is rejected.
     Honesty about peer-leading scores is required where the data supports them.
     Honesty about peer-losing scores is required where the data shows them.
     Refusing both is not honesty — it is abdication.

  Convergence target for Round 2: ≤5 surviving strikes total.

